version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ai_resume_analyzer

  redis:
    image: redis:7

  backend:
    build: ./backend
    command: >
      bash -c "python manage.py migrate &&
               gunicorn --bind 0.0.0.0:8000 --workers 3 core.wsgi:application"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - ./backend/.env

  celery:
    build: ./backend
    command: celery -A core worker -l info
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
      - backend
    env_file:
      - ./backend/.env

  telegram_bot:
    build: ./backend
    command: python bot.py
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - backend

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
