x-backend: &backend
  build: ./backend
  env_file: ./backend/.env
  volumes:
    - media:/app/media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_resume_analyzer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_resume_analyzer"]
      interval: 2s
      retries: 20

  redis:
    image: redis:7

  backend:
    <<: *backend
    command: sh -c "python manage.py migrate && gunicorn --bind 0.0.0.0:8000 --workers 3 core.wsgi:application"
    ports:
      - "8000:8000"

  celery:
    <<: *backend
    command: celery -A core worker -l info

  telegram_bot:
    <<: *backend
    command: python bot.py

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  media:
